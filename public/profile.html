<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - OlongNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <!-- ===================== NAVIGATION BAR ===================== -->
  <header class="navbar" id="navbar">
    <div class="navbar__inner container">
      <button class="navbar__burger" id="navBurger" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <a href="index.html" class="navbar__brand">
        <span class="navbar__logo" aria-hidden="true">
          <img src="img/olongnotes.png" alt="OlongNotes logo" />
        </span>
        <span class="navbar__title-group">
          <span class="navbar__title">OlongNotes</span>
          <span class="navbar__tagline">Knowledge shared, Future shared</span>
        </span>
      </a>

      <nav class="navbar__links" id="navLinks" aria-label="Primary">
        <a href="community.html">Q&amp;A</a>
        <a href="schools.html">Schools</a>
        <a href="subjects.html">Subjects</a>
        <a href="index.html#about">About</a>
      </nav>

      <div class="navbar__actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme" aria-pressed="false">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
          <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </button>

        <button class="btn btn--outline btn--sm" type="button" id="navLoginBtn">Log In</button>
        <button class="btn btn--primary btn--sm" type="button" id="navSignupBtn">Sign Up</button>
      </div>
    </div>
  </header>

  <main id="siteMain">
    <section class="profile-placeholder container">
      <div class="profile-placeholder__card">
        <span class="profile-placeholder__icon" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.6-3.6 5-5.5 7.5-5.5s5.9 1.9 7.5 5.5"/></svg>
        </span>
        <h1 class="profile-placeholder__title">Profile pages are coming soon</h1>
        <p class="profile-placeholder__text">
          You'll be able to see all of a member's questions, answers, and
          contributions here. Hang tight!
        </p>
        <a href="community.html" class="btn btn--primary">Back to Questions</a>
      </div>
    </section>
  </main>

  <footer class="footer" id="about">
    <div class="footer__bottom">
      <p>© 2026 OlongNotes. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth-drawer.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
</content>
